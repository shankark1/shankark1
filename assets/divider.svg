<svg width="1280" height="120" viewBox="0 0 1280 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27272A" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#27272A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{
      50%{opacity:1;transform:scale(1.8)}
    }
  </style>

  <rect width="1280" height="120" fill="#09090B"/>
  <line x1="120" y1="60" x2="1160" y2="60" stroke="url(#line)" stroke-width="1.5"/>
  <circle class="pulse" cx="640" cy="60" r="5" fill="#A78BFA"/>
  <circle class="pulse" cx="560" cy="60" r="2" fill="#8B5CF6"/>
  <circle class="pulse" cx="720" cy="60" r="2" fill="#8B5CF6"/>
</svg>
