<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <style>
    .dot{fill:#7C3AED;opacity:.18;animation:blink 6s infinite}
    .l{stroke:#312E81;opacity:.18}
    @keyframes blink{50%{opacity:.55}}
  </style>

  <rect width="1280" height="320" rx="26" fill="url(#bg)"/>
  <rect x="18" y="18" width="1244" height="284" rx="18"
        fill="rgba(255,255,255,.03)"
        stroke="rgba(255,255,255,.08)"/>

  <g class="l">
    <line x1="140" y1="70" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="480" y2="80"/>
    <line x1="480" y1="80" x2="700" y2="150"/>
    <line x1="700" y1="150" x2="980" y2="90"/>
  </g>

  <circle class="dot" cx="140" cy="70" r="4"/>
  <circle class="dot" cx="300" cy="120" r="4"/>
  <circle class="dot" cx="480" cy="80" r="4"/>
  <circle class="dot" cx="700" cy="150" r="4"/>
  <circle class="dot" cx="980" cy="90" r="4"/>
</svg>
