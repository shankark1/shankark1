<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1020 80) rotate(90) scale(180)">
      <stop stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <style><![CDATA[
    .title{
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size:56px;
      font-weight:700;
      fill:#FAFAFA;
      letter-spacing:1px;
    }

    .subtitle{
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size:20px;
      fill:#A1A1AA;
      letter-spacing:.8px;
    }

    .tag{
      font-family: Inter, Segoe UI, Arial, sans-serif;
      font-size:12px;
      font-weight:600;
      fill:#D4D4D8;
      letter-spacing:1.2px;
    }

    .grid{
      stroke:#27272A;
      stroke-width:.6;
      opacity:.25;
    }

    .particle{
      fill:#A78BFA;
      opacity:.35;
      animation: float 8s ease-in-out infinite;
    }

    .p2{ animation-delay:2s; }
    .p3{ animation-delay:4s; }

    .light{
      animation: breathe 7s ease-in-out infinite;
      transform-origin:1020px 80px;
    }

    .sweep{
      animation: sweep 9s linear infinite;
    }

    @keyframes breathe{
      0%,100%{ opacity:.35; transform:scale(1); }
      50%{ opacity:.9; transform:scale(1.08); }
    }

    @keyframes float{
      0%,100%{ transform:translateY(0px); opacity:.2; }
      50%{ transform:translateY(-14px); opacity:.55; }
    }

    @keyframes sweep{
      0%{ transform:translateX(-340px); opacity:0; }
      20%{ opacity:.25; }
      55%{ opacity:.08; }
      100%{ transform:translateX(1580px); opacity:0; }
    }
  ]]></style>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <g opacity=".25">
    <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280M0 320H1280" class="grid"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360M1200 0V360" class="grid"/>
  </g>

  <circle class="light" cx="1020" cy="80" r="170" fill="url(#glow)" filter="url(#blur)"/>

  <rect x="40" y="40" width="1200" height="280" rx="22"
        fill="rgba(255,255,255,0.03)"
        stroke="rgba(255,255,255,0.08)"/>

  <g opacity=".7">
    <circle cx="58" cy="58" r="4" fill="#EF4444"/>
    <circle cx="74" cy="58" r="4" fill="#F59E0B"/>
    <circle cx="90" cy="58" r="4" fill="#22C55E"/>
  </g>

  <rect x="72" y="78" width="92" height="26" rx="13"
        fill="rgba(124,58,237,.12)"
        stroke="rgba(167,139,250,.28)"/>
  <text x="118" y="95" text-anchor="middle" class="tag">AVAILABLE</text>

  <text x="72" y="170" class="title">Shankar K</text>

  <text x="72" y="205" class="subtitle">
    Full-Stack Developer · AI Engineer
  </text>

  <text x="72" y="236" class="subtitle" fill="#71717A" font-size="16">
    Building scalable software, intelligent systems and
  </text>

  <text x="72" y="262" class="subtitle" fill="#71717A" font-size="16">
    modern developer experiences.
  </text>

  <g transform="translate(72 292)">
    <rect width="118" height="28" rx="14" fill="rgba(255,255,255,.05)"/>
    <text x="59" y="18" text-anchor="middle" class="tag">PYTHON</text>

    <rect x="132" width="118" height="28" rx="14" fill="rgba(255,255,255,.05)"/>
    <text x="191" y="18" text-anchor="middle" class="tag">NEXT.JS</text>

    <rect x="264" width="132" height="28" rx="14" fill="rgba(255,255,255,.05)"/>
    <text x="330" y="18" text-anchor="middle" class="tag">FASTAPI</text>
  </g>

  <g>
    <circle class="particle" cx="1035" cy="82" r="2.4"/>
    <circle class="particle p2" cx="1095" cy="120" r="2.1"/>
    <circle class="particle p3" cx="970" cy="145" r="2.8"/>
    <circle class="particle" cx="930" cy="60" r="1.8"/>
    <circle class="particle p2" cx="1135" cy="55" r="2.2"/>
  </g>

  <rect class="sweep" x="-280" y="0" width="220" height="360"
        fill="url(#shine)" opacity=".18"/>

  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".5" stop-color="white" stop-opacity=".28"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
